<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zayko - Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="padding-bottom:20px;">

<header style="background:#212121;">
  <h2>Zayko Admin Dashboard</h2>
</header>

<div id="loginScreen" style="padding:20px; max-width:350px; margin:auto;">
  <h3>Admin Login</h3>
  <div class="form-group"><input type="email" id="adminEmail" placeholder="Admin Email"></div>
  <div class="form-group"><input type="password" id="adminPass" placeholder="Password"></div>
  <button onclick="loginAdmin()" style="width:100%; padding:10px; background:#FF5722; color:white; border:none; border-radius:6px;">Login</button>
</div>

<div id="adminPanel" style="display:none; padding:15px;">
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <input type="text" id="adminSearch" placeholder="Search Customer / Mobile..." style="flex:1; padding:8px;">
    <select id="villageFilter" style="padding:8px;">
      <option value="ALL">All Villages</option>
      <option value="Bhemal">Bhemal</option>
      <option value="Vajasana">Vajasana</option>
      <option value="Navavas">Navavas</option>
      <option value="Aderan">Aderan</option>
    </select>
  </div>
  <div id="ordersList"></div>
</div>

<script type="module">
  import { db, ref, onValue, update, auth, signInWithEmailAndPassword } from './firebase-config.js';

  window.loginAdmin = function() {
    const e = document.getElementById('adminEmail').value;
    const p = document.getElementById('adminPass').value;
    signInWithEmailAndPassword(auth, e, p).then(() => {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('adminPanel').style.display = "block";
      listenForOrders();
    }).catch(err => alert("Login Failed: " + err.message));
  };

  function listenForOrders() {
    onValue(ref(db, 'orders'), (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('ordersList');
      container.innerHTML = "";
      if (!data) return container.innerHTML = "<p>No orders yet.</p>";

      Object.keys(data).reverse().forEach(key => {
        const o = data[key];
        const card = document.createElement('div');
        card.style.cssText = "background:white; border:1px solid #ccc; padding:12px; margin-bottom:12px; border-radius:8px;";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span style="font-size:18px; color:#D32F2F;">Order #${o.orderId}</span>
            <span class="badge bg-new">${o.status}</span>
          </div>
          <div style="font-size:16px; font-weight:bold; margin-top:5px;">Customer: ${o.name}</div>
          <div>📞 Mobile: ${o.mobile} | 🏡 Village: <b>${o.village}</b></div>
          <div>📍 Address: ${o.address}</div>
          <div style="font-size:12px; color:#666;">📅 ${o.date} at ${o.time}</div>
          <hr>
          <pre style="font-family:inherit; margin:5px 0;">${o.items}</pre>
          <hr>
          <div>Subtotal: ₹${o.subtotal} | Delivery: ₹${o.shipping} | COD: ₹${o.codCharge}</div>
          <div style="font-weight:bold; font-size:15px; color:#2E7D32;">Final Total: ₹${o.finalTotal} (${o.paymentMethod})</div>
          ${o.utr ? `<small>UTR: ${o.utr}</small>` : ''}
          <div style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap;">
            <a href="tel:${o.mobile}" style="padding:6px 12px; background:#2196F3; color:white; border-radius:4px; text-decoration:none;">Call</a>
            <a href="https://wa.me/91${o.mobile}" style="padding:6px 12px; background:#4CAF50; color:white; border-radius:4px; text-decoration:none;">WhatsApp</a>
            <button onclick="changeStatus('${key}', '👨‍🍳 Preparing')" style="padding:6px;">Preparing</button>
            <button onclick="changeStatus('${key}', '🛵 Out for Delivery')" style="padding:6px;">Out for Delivery</button>
            <button onclick="changeStatus('${key}', '✅ Delivered')" style="padding:6px; background:#C8E6C9;">Delivered</button>
          </div>
        `;
        container.appendChild(card);
      });
    });
  }

  window.changeStatus = function(orderKey, newStatus) {
    update(ref(db, `orders/${orderKey}`), { status: newStatus });
  };
</script>
</body>
</html>
